cache_dir: data/cache_topk
student_init_path: models/student_init_4      # was: models/student_init
output_dir: models/student

num_layers: 4                                 # documents intent; actual layers come from the loaded model
freeze_embeddings: true
dtype: float32

epochs: 3                                     # was 2; SGD converges slower
batch_size: 1
gradient_accumulation_steps: 8                # was 4; keeps optimizer-step count similar
learning_rate: 3.0e-4                         # was 3e-5; ×10 for SGD
weight_decay: 0.01
max_grad_norm: 1.0
temperature: 2.0
kd_alpha: 0.7
gradient_checkpointing: true
warmup_ratio: 0.05
log_every: 10
save_every: 500
val_fraction: 0.05
resume_from: null